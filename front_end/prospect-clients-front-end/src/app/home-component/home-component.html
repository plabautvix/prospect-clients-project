<div class="hero-section">
  <div class="hero-content">
    <h1 class="hero-title">
      <span class="gradient-text">Hunter Leads</span>
      <span class="subtitle">Prospecção inteligente</span>
    </h1>
    <p class="hero-desc">Encontre, analise e converta clientes com o poder da automação.</p>
    
    <form class="hero-search" (submit)="getLeads($event)">
      <div class="search-input-wrapper">
        <mat-icon fontIcon="search"></mat-icon>
        <input type="search" placeholder="Busque por clientes (ex: Clínicas, Academias...)" [formControl]="searchText" />
      </div>
      <button mat-flat-button color="primary" type="submit">Buscar</button>
    </form>
  </div>

  <div class="hero-actions">
    <button mat-stroked-button class="glass-btn" routerLink="/operations">
      <mat-icon fontIcon="travel_explore"></mat-icon>
      Operações
    </button>
    <button mat-stroked-button class="glass-btn" routerLink="/whatsapp">
      <mat-icon fontIcon="qr_code_2"></mat-icon>
      WhatsApp
    </button>
  </div>
</div>

<div class="main-content container">
  <!-- Floating batch action bar (only visible when items selected) -->
  <div class="batch-bar" [class.visible]="selectedLeadsCount() > 0">
    <div class="batch-info">
      <span class="count">{{ selectedLeadsCount() }}</span>
      <span class="label">selecionados</span>
    </div>
    <div class="batch-actions">
      <button mat-flat-button color="accent" (click)="openBatchDialog()">
        <mat-icon fontIcon="send"></mat-icon>
        Enviar mensagem em lote
      </button>
    </div>
  </div>

  <div class="container-cards">
    @for (lead of leadsList; track lead?.nome) {
      <app-card-lead
          [nome]="lead?.nome || ''"
          [telefone]="lead?.telefone || ''"
          [endereco]="lead?.endereco || ''"
          [site]="lead?.site || ''"
          [foto]="lead?.foto || ''"
          (selectedChange)="onCardSelectedChange($event)">
      </app-card-lead>
    } @empty {
      <div class="empty-state" *ngIf="leadsList.length === 0">
        <mat-icon fontIcon="manage_search"></mat-icon>
        <p>Faça uma busca para encontrar novos leads.</p>
      </div>
    }
  </div>
</div>
