<h2 mat-dialog-title>Enviar mensagens em lote</h2>
<div mat-dialog-content>
  <mat-form-field appearance="outline" class="full">
    <mat-label>Mensagem base</mat-label>
    <textarea matInput rows="6" [formControl]="message" placeholder="Escreva a mensagem base para todos"></textarea>
    <mat-hint>Os dados da empresa serão anexados automaticamente.</mat-hint>
  </mat-form-field>
  <p class="note">Ex.: “Olá! Tenho uma proposta de melhoria de site e captação.”</p>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="send()">Enviar</button>
</div>
