<h2 mat-dialog-title>Enviar mensagem automatizada</h2>
<div mat-dialog-content>
  <mat-form-field appearance="outline" class="full">
    <mat-label>Mensagem</mat-label>
    <textarea matInput rows="8" [formControl]="message" placeholder="Escreva sua mensagem"></textarea>
  </mat-form-field>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="send()">Enviar</button>
</div>
