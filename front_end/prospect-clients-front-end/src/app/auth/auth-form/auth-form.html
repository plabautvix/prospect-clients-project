
<div class="container">

<div class="container-toggle">
<mat-button-toggle-group name="fontStyle" aria-label="Font Style" [formControl]="selectedToggle">
<mat-button-toggle value="cadastre">Cadastro</mat-button-toggle>
<mat-button-toggle value="login">Login</mat-button-toggle>
</mat-button-toggle-group>
</div>

<mat-form-field class="all-width">
    <mat-label>Email</mat-label>
    <input matInput type="email" placeholder="Exemplo@gmail.com" [formControl]="email">
</mat-form-field>

<mat-form-field class="all-width">
    <mat-label>Senha</mat-label>
    <input matInput type="password" placeholder="Digite sua senha" [formControl]="password">
</mat-form-field>
<button mat-raised-button (click)="handleAction()">{{
        selectedToggle.value == "login" ? "Entrar" : "Cadastrar"
    }}
</button>
</div>
