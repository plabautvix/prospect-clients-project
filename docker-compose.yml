services:

  # ─── Infrastructure ───────────────────────────────────────────────────────

  # Os brokers falam apenas com os serviços, pela rede interna do compose, e
  # nada de fora os alcança. Por isso não há TLS entre eles: o hop já é privado,
  # e quem estivesse dentro da rede para farejá-lo já teria acesso às senhas nas
  # variáveis de ambiente. Usuário e senha continuam exigidos. Ver ARCHITECTURE.md,
  # seção 7, S3 e S7.
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # Só para inspecionar o broker de fora; os serviços usam mosquitto:1883.
      - "${MQTT_HOST_PORT:-11883}:1883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-prospect}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-dev-mqtt-pass-change-me}
    # A configuração é escrita aqui em vez de virar um arquivo no repositório:
    # são três linhas, e sem ela o mosquitto só escuta em localhost e recusa os
    # outros containers. O arquivo de senhas vem do env no boot.
    # rm -f: mosquitto_passwd -c recusa sobrescrever, e o arquivo sobrevive a um
    # restart. chown: ele é escrito como root, mas o broker larga privilégio
    # para o usuário mosquitto antes de lê-lo.
    command:
      - sh
      - -c
      - |
        printf 'listener 1883 0.0.0.0\nallow_anonymous false\npassword_file /mosquitto/config/passwd\n' > /mosquitto/config/mosquitto.conf &&
        rm -f /mosquitto/config/passwd &&
        mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD" &&
        chown mosquitto:mosquitto /mosquitto/config/passwd &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf

  # Gateway do WhatsApp Web (WAHA Core). Sem porta publicada: só o
  # whatsapp-sender fala com ele, pela rede do compose. O QR code para conectar
  # o número aparece na tela de Campanhas. Ver ARCHITECTURE.md, seção 3.5.
  waha:
    image: devlikeapro/waha:latest
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-dev-waha-key-change-me}
      # GOWS fala o protocolo do WhatsApp direto, sem navegador. O WEBJS, padrão
      # da imagem, quebrava a renovação do QR code (refreshQR is not a function)
      # e derrubava a sessão antes da leitura.
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      # Volta a sessão conectada depois de um restart, sem novo QR code.
      WAHA_WORKER_RESTART_SESSIONS: "true"
    volumes:
      - waha-sessions:/app/.sessions

  # ─── Application services ─────────────────────────────────────────────────

  backend:
    build: ./back_end
    ports:
      # Host port is configurable to avoid clashing with other local stacks.
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-prospect}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-dev-mqtt-pass-change-me}
      # Override JWT_SECRET in real deployments (e.g. via .env / secrets manager).
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-720}
      # Shared service credential validated by the backend (X-Service-Key).
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key-change-me}
    volumes:
      - ./back_end:/app
    depends_on:
      - mosquitto

  maps-service:
    build: ./serach_services/maps/maps_service
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-prospect}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-dev-mqtt-pass-change-me}
      BACKEND_API_URL: http://backend:8000
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key-change-me}
      SELENIUM_HEADLESS: "true"
    volumes:
      - ./serach_services/maps/maps_service/src:/app/src
    depends_on:
      mosquitto:
        condition: service_started
      backend:
        condition: service_started

  instagram-service:
    build: ./serach_services/instagram/instagram_service
    # Chrome needs more than the default 64MB of shared memory.
    shm_size: 1gb
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-prospect}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-dev-mqtt-pass-change-me}
      MQTT_TOPIC: prospect/instagram
      BACKEND_API_URL: http://backend:8000
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key-change-me}
      # Persisted so the cookie-consent choice survives a restart.
      CHROME_PROFILE_DIR: /data/chrome-profile
    volumes:
      - ./serach_services/instagram/instagram_service/src:/app/src
      - instagram-chrome-profile:/data/chrome-profile
    depends_on:
      mosquitto:
        condition: service_started
      backend:
        condition: service_started

  # Envia as mensagens de WhatsApp das campanhas. Não guarda estado: mensagens
  # e ritmo ficam no banco do backend, então derrubá-lo não perde nada.
  whatsapp-sender:
    build: ./sender_services/whatsapp_sender
    environment:
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-dev-waha-key-change-me}
      BACKEND_API_URL: http://backend:8000
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key-change-me}
    volumes:
      - ./sender_services/whatsapp_sender/src:/app/src
    depends_on:
      - waha
      - backend

  # Envia as mensagens de Instagram (DM) das campanhas, com um Chrome logado na
  # conta remetente. Perfil de Chrome próprio, separado do instagram-service:
  # a busca não usa conta, e uma restrição nesta conta não pode atingi-la.
  instagram-dm:
    build: ./sender_services/instagram_dm
    shm_size: 1gb
    # Digitar uma mensagem longa leva mais que os 10s padrão. Com folga, o
    # SIGTERM termina e reporta a mensagem em mãos em vez de matar no meio.
    stop_grace_period: 2m
    environment:
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME:-}
      INSTAGRAM_PASSWORD: ${INSTAGRAM_PASSWORD:-}
      CHROME_PROFILE_DIR: /data/chrome-profile
      BACKEND_API_URL: http://backend:8000
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key-change-me}
    volumes:
      - ./sender_services/instagram_dm/src:/app/src
      - instagram-dm-profile:/data/chrome-profile
    depends_on:
      - backend

  frontend:
    build: ./front_end
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  instagram-chrome-profile:
  waha-sessions:
  instagram-dm-profile:
