services:

  # ─── Infrastructure ───────────────────────────────────────────────────────

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "8883:8883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-prospect}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-dev-mqtt-pass-change-me}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./certs/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./certs/mosquitto/server.crt:/mosquitto/certs/server.crt:ro
      - ./certs/mosquitto/server.key:/mosquitto/certs/server.key:ro
    # Build the password file from env on startup, then run the broker.
    # rm -f: mosquitto_passwd -c refuses to overwrite an existing file, and the
    # file survives a container restart. chown: the file is written as root but
    # the broker drops privileges to the mosquitto user before reading it.
    command:
      - sh
      - -c
      - |
        rm -f /mosquitto/config/passwd &&
        mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD" &&
        chown mosquitto:mosquitto /mosquitto/config/passwd &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5671:5671"
      - "15672:15672"   # management UI at http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-prospect}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev-rabbit-pass-change-me}
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./certs/ca.crt:/etc/rabbitmq/certs/ca.crt:ro
      - ./certs/rabbitmq/server.crt:/etc/rabbitmq/certs/server.crt:ro
      - ./certs/rabbitmq/server.key:/etc/rabbitmq/certs/server.key:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Application services ─────────────────────────────────────────────────

  backend:
    build: ./back_end
    ports:
      # Host port is configurable to avoid clashing with other local stacks.
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      MQTT_USERNAME: ${MQTT_USERNAME:-prospect}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-dev-mqtt-pass-change-me}
      MQTT_TLS: "true"
      MQTT_CA_CERT: /certs/ca.crt
      # Override JWT_SECRET in real deployments (e.g. via .env / secrets manager).
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-720}
      # Shared service credential validated by the backend (X-Service-Key).
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key-change-me}
    volumes:
      - ./back_end:/app
      - ./certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      - mosquitto

  maps-service:
    build: ./serach_services/maps/maps_service
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      MQTT_USERNAME: ${MQTT_USERNAME:-prospect}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-dev-mqtt-pass-change-me}
      MQTT_TLS: "true"
      MQTT_CA_CERT: /certs/ca.crt
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5671
      RABBITMQ_USER: ${RABBITMQ_USER:-prospect}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev-rabbit-pass-change-me}
      RABBITMQ_TLS: "true"
      RABBITMQ_CA_CERT: /certs/ca.crt
      RABBITMQ_EXCHANGE: fila_mensagens
      RABBITMQ_ROUTING_KEY: enviar
      BACKEND_API_URL: http://backend:8000
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key-change-me}
      SELENIUM_HEADLESS: "true"
    volumes:
      - ./serach_services/maps/maps_service/src:/app/src
      - ./certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_started
      backend:
        condition: service_started

  whatsapp:
    build: ./whatsapp_services
    ports:
      - "3001:3001"
    volumes:
      - ./whatsapp_services:/app
      - /app/node_modules
      - whatsapp_auth:/app/.wwebjs_auth
      - ./certs/ca.crt:/certs/ca.crt:ro
    environment:
      PORT: 3001
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5671
      RABBITMQ_USER: ${RABBITMQ_USER:-prospect}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev-rabbit-pass-change-me}
      RABBITMQ_TLS: "true"
      RABBITMQ_CA_CERT: /certs/ca.crt
      RABBITMQ_EXCHANGE: fila_mensagens
      RABBITMQ_ROUTING_KEY: enviar
    depends_on:
      rabbitmq:
        condition: service_healthy

  frontend:
    build: ./front_end
    ports:
      - "80:80"
    depends_on:
      - backend
      - whatsapp

volumes:
  whatsapp_auth:
