services:

  # ─── Infrastructure ───────────────────────────────────────────────────────

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-prospect}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-dev-mqtt-pass-change-me}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # Build the password file from env on startup, then run the broker.
    command:
      - sh
      - -c
      - mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD" && exec mosquitto -c /mosquitto/config/mosquitto.conf

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI at http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-prospect}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev-rabbit-pass-change-me}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Application services ─────────────────────────────────────────────────

  backend:
    build: ./back_end
    ports:
      - "8000:8000"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-prospect}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-dev-mqtt-pass-change-me}
      # Override JWT_SECRET in real deployments (e.g. via .env / secrets manager).
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-720}
      # Shared service credential validated by the backend (X-Service-Key).
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key-change-me}
    volumes:
      - ./back_end:/app
    depends_on:
      - mosquitto

  maps-service:
    build: ./serach_services/maps/maps_service
    profiles:
      - headless
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-prospect}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-dev-mqtt-pass-change-me}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-prospect}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev-rabbit-pass-change-me}
      RABBITMQ_EXCHANGE: fila_mensagens
      RABBITMQ_ROUTING_KEY: enviar
      BACKEND_API_URL: http://backend:8000
      SERVICE_API_KEY: ${SERVICE_API_KEY:-dev-service-key-change-me}
      SELENIUM_HEADLESS: "true"
    volumes:
      - ./serach_services/maps/maps_service/src:/app/src
    depends_on:
      rabbitmq:
        condition: service_healthy
      mosquitto:
        condition: service_started
      backend:
        condition: service_started

  whatsapp:
    build: ./whatsapp_services
    ports:
      - "3001:3001"
    volumes:
      - ./whatsapp_services:/app
      - /app/node_modules
      - whatsapp_auth:/app/.wwebjs_auth
    environment:
      PORT: 3001

  frontend:
    build: ./front_end
    ports:
      - "80:80"
    depends_on:
      - backend
      - whatsapp

volumes:
  whatsapp_auth:
