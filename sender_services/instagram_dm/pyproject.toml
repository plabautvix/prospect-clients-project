[project]
name = "instagram-dm"
version = "0.1.0"
description = "Sends queued campaign messages as Instagram direct messages"
authors = [
    {name = "Pedro Lucas Andrade Braganca", email = "pedroluxa871632@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nodriver (==0.50.3)",
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "opentelemetry-sdk (==1.45.1)",
    "opentelemetry-exporter-otlp-proto-http (==1.45.1)",
    "opentelemetry-instrumentation-requests (==0.66b1)",
    "opentelemetry-instrumentation-logging (==0.66b1)"
]

[project.optional-dependencies]
dev = ["pytest (>=8.3.0,<9.0.0)"]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
