[project]
name = "maps-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Pedro Lucas Andrade Braganca",email = "pedroluxa871632@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt (>=2.1.0,<3.0.0)",
    "selenium (>=4.38.0,<5.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "opentelemetry-sdk (==1.45.1)",
    "opentelemetry-exporter-otlp-proto-http (==1.45.1)",
    "opentelemetry-instrumentation-requests (==0.66b1)",
    "opentelemetry-instrumentation-logging (==0.66b1)"
]

[tool.poetry]
packages = [{include = "maps_service", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
